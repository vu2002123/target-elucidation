[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "target_elucidation"
version = "0.0.1"
description = "Pipeline to elucidate molecular targets of active compounds"
authors = [
  { name = "Vu" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["target_elucidation"]
include = ["pyproject.toml", "target_elucidation/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["target_elucidation"]
force-sort-within-sections = true

